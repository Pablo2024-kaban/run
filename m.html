<head>

<title>Вход в метро</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    background: #030305;
    overflow: hidden;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  .wrap {
    width: 100vw;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .scene {
    position: relative;
    line-height: 0;
    max-width: 100vw;
    max-height: 100vh;
  }
  .scene > img {
    display: block;
    max-width: 100vw;
    max-height: 100vh;
    width: auto;
    height: auto;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }
  .hotspots {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .hotspots a {
    cursor: pointer;
  }
  .arch {
    fill: rgba(255,255,255,0);
    stroke: transparent;
    stroke-width: 0;
    transition: fill 0.35s ease, filter 0.35s ease;
  }
  .arch-blue:hover,
  .hotspots a:focus-visible .arch-blue {
    fill: rgba(70, 130, 255, 0.16);
    filter: drop-shadow(0 0 18px rgba(80, 150, 255, 0.85));
  }
  .arch-red:hover,
  .hotspots a:focus-visible .arch-red {
    fill: rgba(255, 50, 50, 0.16);
    filter: drop-shadow(0 0 18px rgba(255, 60, 60, 0.85));
  }
  .hotspots a:focus { outline: none; }
  .label {
    position: absolute;
    bottom: 8.5%;
    transform: translateX(-50%);
    padding: 0.4rem 0.9rem;
    border-radius: 999px;
    font-size: 0.78rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: #fff;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease, transform 0.3s ease;
    backdrop-filter: blur(6px);
  }
  .label-blue {
    left: 30.3%;
    background: rgba(20, 40, 120, 0.55);
    box-shadow: 0 0 16px rgba(80, 140, 255, 0.35);
  }
  .label-red {
    left: 69.2%;
    background: rgba(90, 16, 16, 0.55);
    box-shadow: 0 0 16px rgba(255, 70, 70, 0.35);
  }
  .scene:has(.link-blue:hover) .label-blue,
  .scene:has(.link-blue:focus-visible) .label-blue,
  .scene:has(.link-red:hover) .label-red,
  .scene:has(.link-red:focus-visible) .label-red {
    opacity: 1;
    transform: translateX(-50%) translateY(-4px);
  }
  @media (hover: none) {
    .label { opacity: 0.85; }
    .arch-blue { fill: rgba(70, 130, 255, 0.06); }
    .arch-red { fill: rgba(255, 50, 50, 0.06); }
  }
</style>
</head>
